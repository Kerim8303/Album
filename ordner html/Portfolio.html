<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kerim Portfolio</title>

<style>

body {
  margin: 0;
  font-family: monospace;

  background-image: url("https://as2.ftcdn.net/v2/jpg/02/56/89/77/1000_F_256897736_h5D7q4UfGuf02spJi3Q4zAFjzylc9Vsg.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/*  MAIN CARD (IT STYLE) */
.card {
  background: rgba(10, 15, 26, 0.95);
  width: 340px;
  padding: 28px;
  border-radius: 14px;
  color: #57bd2f;

  /* 🔥 sichtbarer "Front-Rahmen" */
  box-shadow:
    0 0 0 3px #000,
    0 12px 35px rgba(0,0,0,0.7);

  border: 1px solid #334155;
}

/* NAME */
.card h1 {
  text-align: center;
  font-size: 22px;
  margin-bottom: 20px;
  letter-spacing: 2px;
}

/* INFO BOXEN */
.item {
  margin: 10px 0;
  padding: 10px;
  background: rgba(255,255,255,0.03);
  border-left: 3px solid #000;
  border-radius: 8px;
}

.label {
  color: #9ca3af;
  display: block;
  font-size: 12px;
}

.value {
  font-size: 15px;
  margin-top: 2px;
}

</style>
</head>

<body>

<div class="card">

  <h1>KERIM AKKOCA</h1>

  <div class="item">
    <span class="label">Alter</span>
    <div class="value">14</div>
  </div>

  <div class="item">
    <span class="label">Herkunft</span>
    <div class="value">Türkei</div>
  </div>

  <div class="item">
    <span class="label">Familie</span>
    <div class="value">Eltern, Bruder, Katze</div>
  </div>

  <div class="item">
    <span class="label">Lieblingsauto</span>
    <div class="value">BMW M4 CSL</div>
  </div>

  <div class="item">
    <span class="label">Lieblingstier</span>
    <div class="value">Katze</div>
  </div>

  <div class="item">
    <span class="label">Hobbys</span>
    <div class="value">Joggen, Schwimmen, Fussball, Zeichnen</div>
  </div>

  <div class="item">
    <span class="label">Interessen</span>
    <div class="value">Computertechnik, Musik</div>
  </div>

  <div class="item">
    <span class="label">Sprachen</span>
    <div class="value">Deutsch, Türkisch, Englisch</div>
  </div>

</div>

</body>
</html>
